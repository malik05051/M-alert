# Construit les applications de bureau Windows (installateur + portable) et Linux (AppImage + .deb).
# À chaque modification de l'application, manuellement (onglet Actions), ou avec un tag « v1.0.0 » :
# les fichiers sont alors joints à une Release.
name: Applications de bureau

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'server/**', 'render.yaml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: M-Alert-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
