# Construit les applications de bureau Windows (installateur + portable) et Linux (AppImage + .deb).
# À chaque modification de l'application et manuellement (onglet Actions) : fichiers dans « Artifacts ».
# Pour publier une version : onglet Actions > « Applications de bureau » > Run workflow, en indiquant
# la version (ex. 1.0.0, identique à package.json), ou pousser un tag « v1.0.0 ».
# Le tag et la Release sont alors créés avec tous les fichiers.
name: Applications de bureau

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 1.0.0) ; laisser vide pour construire sans publier"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: M-Alert-${{ matrix.os }}
          # latest*.yml et *.blockmap servent aux mises à jour automatiques (Windows, AppImage).
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  # Une seule Release par tag, une fois Windows et Linux construits.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier que la version correspond à package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::La version $TAG ne correspond pas à package.json ($expected)."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Somme de contrôle des fichiers
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: M-Alert ${{ env.TAG }}
          body_path: .github/release-notes.md
          files: dist/*
