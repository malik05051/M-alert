# Construit les installateurs de bureau (Windows, macOS, Linux).
# Lancement manuel (onglet Actions) ou en poussant un tag « v1.0.0 » : les fichiers sont alors joints à une Release.
name: Applications de bureau

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: M-Alert-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
