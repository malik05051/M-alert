# Construit les applications de bureau Windows (installateur + portable) et Linux (AppImage + .deb).
# À chaque modification de l'application et manuellement (onglet Actions) : fichiers dans « Artifacts ».
# Avec un tag « v1.0.0 » : publication d'une Release avec tous les fichiers.
name: Applications de bureau

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: M-Alert-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # Une seule Release par tag, une fois Windows et Linux construits.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Somme de contrôle des fichiers
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          name: M-Alert ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*
